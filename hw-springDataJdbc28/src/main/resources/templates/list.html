<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список клиентов</title>
</head>
<body>
<h1>Клиенты</h1>

<a href="/clients/new">➕ Добавить клиента</a>

<table border="1" style="margin-top: 20px;">
    <thead>
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Адрес</th>
        <th>Телефоны</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="client : ${clients}">
        <td th:text="${client.id}">1</td>
        <td th:text="${client.name}">Иван</td>
        <td>
                    <span th:if="${client.address != null}"
                          th:text="${client.address.street}">
                        ул. Ленина
                    </span>
            <span th:unless="${client.address != null}">-</span>
        </td>
        <td>
            <!-- Показываем телефоны -->
            <ul th:if="${not #lists.isEmpty(client.phones)}">
                <li th:each="phone : ${client.phones}"
                    th:text="${phone.number}">
                    123-45-67
                </li>
            </ul>
            <span th:unless="${not #lists.isEmpty(client.phones)}">-</span>
        </td>
        <td>
            <a th:href="@{/clients/{id}(id=${client.id})}">👁️</a>
            <a th:href="@{/clients/delete/{id}(id=${client.id})}"
               onclick="return confirm('Удалить?')">🗑️</a>
        </td>
    </tr>
    </tbody>
</table>

<div th:if="${#lists.isEmpty(clients)}" style="margin-top: 20px;">
    <p>Клиентов пока нет</p>
</div>

<p style="margin-top: 20px;">
    <a href="/">На главную</a>
</p>
</body>
</html>
